server {
    listen 80;
    server_name _; # Substitua pelo seu domínio, ex: star.dev.br

    # Diretório raiz onde os arquivos estáticos estão localizados
    root /usr/share/nginx/html; # Ajuste para o caminho real no seu servidor
    index index.html;

    # Otimização de entrega de arquivos estáticos
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Compressão Gzip para acelerar o carregamento
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Regras de Cache para Arquivos Estáticos (Imagens, CSS, JS, Fonts)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Tratamento para requisições na raiz
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeçalhos de Segurança Básicos
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}
